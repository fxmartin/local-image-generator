[project]
name = "local-image-generator"
version = "0.2.0"
description = "Local image generation CLI for Qwen-Image-2.1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FX Martin" }]
keywords = ["image-generation", "qwen-image", "cli", "local-ai", "stable-diffusion-cpp", "mlx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "pillow>=10",
    "httpx>=0.27",
    "platformdirs>=4",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]
mlx = ["mflux>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Homepage = "https://github.com/fxmartin/local-image-generator"
Repository = "http://home-lab.tailac3c7a.ts.net:8080/root/local-image-generator"

[project.scripts]
lig = "lig.cli.app:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/lig/backends", "src/lig/core", "src/lig/models", "src/lig/cli"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

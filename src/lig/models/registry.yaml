# Pre-flight memory estimate: sum(loaded weights) * factor + bytes_per_pixel * w * h.
# sdcpp calibrated on the XPS spike (docs/bench/xps13.md): 8949.76 MB of weights for
# 9.90 GB of files (factor 0.95) and a 3551 MB VAE decode at 1024² (3400 B/px).
engine_memory:
  sdcpp:
    factor: 0.95
    activation_bytes_per_pixel: 3400
  ncnn:
    factor: 1.0
    activation_bytes_per_pixel: 3400

sets:
  # Default for sd.cpp: first set listed for the engine.
  sdcpp-q4:
    engine: sdcpp
    artifacts:
      - qwen-image-2.1-q4-transformer
      - qwen-image-2.1-text-encoder
      - qwen-image-2.1-vae
      - qwen-image-2.1-mmproj
  # Alternative: higher-fidelity transformer, same encoder/VAE/mmproj.
  sdcpp-q8:
    engine: sdcpp
    artifacts:
      - qwen-image-2.1-q8-transformer
      - qwen-image-2.1-text-encoder
      - qwen-image-2.1-vae
      - qwen-image-2.1-mmproj
  # Full-precision ncnn model folder; unpacks to <models_dir>/qwenimage21/.
  ncnn-bf16:
    engine: ncnn
    artifacts:
      - ncnn-processor-merges-txt
      - ncnn-processor-vocab-txt
      - ncnn-text_encoder-text_encoder-bin
      - ncnn-text_encoder-text_encoder-param
      - ncnn-transformer-blocks-bin
      - ncnn-transformer-blocks-param
      - ncnn-transformer-input-bin
      - ncnn-transformer-input-param
      - ncnn-transformer-output-bin
      - ncnn-transformer-output-param
      - ncnn-vae-decoder-bin
      - ncnn-vae-decoder-param
      - ncnn-vae-encoder-bin
      - ncnn-vae-encoder-param
      - ncnn-vision-vision_encoder-bin
      - ncnn-vision-vision_encoder-param
      - ncnn-vision-vision_pos_embed-f32
